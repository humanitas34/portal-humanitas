<style>
  html, body { margin:0; height:100%; background:#0a1e37; overflow:hidden; }
  /* O portal ocupa a janela inteira */
  #portal { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:#f5f2ea;
    opacity:0; transition:opacity .45s ease; }
  #portal.pronto { opacity:1; }
  /* Tela de carregamento (mesmo visual da abertura do app) */
  #abertura { position:fixed; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:radial-gradient(circle at 50% 35%, #0f2a4a, #0a1e37); color:#f5f2ea;
    font-family:Georgia,'Times New Roman',serif; transition:opacity .45s ease; }
  #abertura.some { opacity:0; pointer-events:none; }
  #abertura img { height:140px; width:auto; filter:drop-shadow(0 8px 18px rgba(0,0,0,.5)); animation:flutua 3.2s ease-in-out infinite; }
  @keyframes flutua { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
  #abertura h1 { font-family:'Cinzel','Trajan Pro',Georgia,serif; font-size:clamp(2.2rem,8vw,3.2rem); letter-spacing:.18em; text-indent:.18em;
    color:#e3c987; margin:.35em 0 0; }
  #abertura .loja { font-family:'Cinzel',Georgia,serif; color:#c9a24b; letter-spacing:.08em; margin-top:.4rem; }
  .barra { position:relative; width:200px; height:3px; border-radius:99px; background:rgba(201,162,75,.16); overflow:hidden; margin-top:2.2rem; }
  .barra::before { content:''; position:absolute; top:0; left:-45%; height:100%; width:45%; border-radius:99px;
    background:linear-gradient(90deg, transparent, #e3c987, #c9a24b, transparent); animation:varre 1.25s ease-in-out infinite; }
  @keyframes varre { to { left:100%; } }
  #aviso { margin-top:1.6rem; font-size:.92rem; color:#cdd6e4; max-width:34rem; line-height:1.5; }
  #aviso a { color:#e3c987; }
  @media (prefers-reduced-motion: reduce) { #abertura img, .barra::before { animation:none; } }
</style>

<script>

  var LINK_DO_APP = 'https://script.google.com/macros/s/AKfycbzc03EQPc4-9_8d0AEAjt8m0rK2xF0HUpF7DjHJqFWLlc4lzQn9IYQfLxyzyzDD_CEU6g/exec';

  (function () {
    var frame = document.getElementById('portal');
    var abertura = document.getElementById('abertura');
    var aviso = document.getElementById('aviso');
    var configurado = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(LINK_DO_APP);

    if (!configurado) {
      document.getElementById('barra').style.display = 'none';

      abertura.classList.add('some');
      setTimeout(function () { abertura.style.display = 'none'; }, 500);
